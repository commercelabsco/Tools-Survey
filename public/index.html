<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tools We Use – Survey | CommerceLabs</title>
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <img class="logo" alt="CommerceLabs" src="/logo.png">
  <h1>Which tools do you use?</h1>
  <p class="lede">Tick every app you use for work. If something you use isn’t listed, add it in the box at the bottom.</p>

  <section>
    <div class="who">
      <div class="field">
        <label for="fullName">Your name</label>
        <input id="fullName" type="text" placeholder="First and last name" autocomplete="name">
      </div>
      <div class="field">
        <label for="dept">Department</label>
        <select id="dept">
          <option value="">Select your department</option>
          <option>People Culture</option>
          <option>Omnichannel</option>
          <option>Content</option>
          <option>Executive Team</option>
          <option>Finance</option>
          <option>Supply Chain</option>
          <option>Client Success</option>
          <option>NPD</option>
          <option>Customer Experience</option>
          <option>Category Team</option>
        </select>
      </div>
    </div>
    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="Search tools…" aria-label="Search tools">
      <span class="count" id="count">0 selected</span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="other">
      <h2>Other tools not on the list</h2>
      <p>One per line or separated by commas.</p>
      <textarea id="otherTools" placeholder="e.g. Notion, Figma, Asana"></textarea>
    </div>
  </section>
</div>

<div class="bar">
  <div class="in">
    <span class="status" id="status">Select your tools, then submit.</span>
    <button class="btn" id="submit">Submit</button>
  </div>
</div>

<script>
const TOOLS = ["Amazon Web Services","n8n","ChatGPT","Datarova","Dropbox","Fivetran","Frame.io","Kalodata","Lucid","Make","Twilio","Zapier","Zendesk","JungleScout","Sellerise","Pixelfy","Lumen5","Shutterstock","Cruva","ExpressVPN","Fastmoss","Foreplay","Klaviyo","Loom","Data Dive","SimpleSat","Keepa","Helium 10","Canva","Sprout Payroll","Slack","GS1","GoDaddy","DreamHost","Intellivy","Power BI","Midjourney","Squarespace","Tello","Expandfi","SellerSprite","Render","Keeper Security","Claude Code","Zoom","Scraper API","Higgsfield","GitHub","Vercel","Railway"].sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:"base"}));
const $ = id => document.getElementById(id);
const grid = $("grid"), statusEl = $("status"), btn = $("submit");

// Remembers this browser so a person can update their answer instead of submitting twice
let rid = null;
try { rid = localStorage.getItem("toolSurveyId"); if(!rid){ rid = crypto.randomUUID(); localStorage.setItem("toolSurveyId", rid); } } catch(e) { rid = crypto.randomUUID(); }

TOOLS.forEach((t,i)=>{
  const d=document.createElement("div"); d.className="tool"; d.dataset.name=t.toLowerCase();
  const inp=document.createElement("input"); inp.type="checkbox"; inp.id="t"+i; inp.value=t;
  const lab=document.createElement("label"); lab.htmlFor="t"+i; lab.textContent=t;
  d.append(inp,lab); grid.append(d);
});
const updateCount=()=>$("count").textContent=grid.querySelectorAll("input:checked").length+" selected";
grid.addEventListener("change",updateCount);
$("search").addEventListener("input",e=>{
  const q=e.target.value.trim().toLowerCase();
  grid.querySelectorAll(".tool").forEach(el=>el.classList.toggle("hidden", q && !el.dataset.name.includes(q)));
});

btn.addEventListener("click", async ()=>{
  const name=$("fullName").value.trim(), department=$("dept").value;
  const tools=[...grid.querySelectorAll("input:checked")].map(i=>i.value);
  const other=$("otherTools").value.split(/[\n,]/).map(x=>x.trim()).filter(Boolean);
  if(!name){ statusEl.textContent="Please enter your name."; $("fullName").focus(); return; }
  if(!department){ statusEl.textContent="Please select your department."; $("dept").focus(); return; }
  if(!tools.length && !other.length){ statusEl.textContent="Select at least one tool."; return; }
  btn.disabled=true; statusEl.textContent="Saving…";
  try{
    const r=await fetch("/api/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:rid,name,department,tools,other})});
    if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error||"Save failed");
    statusEl.textContent="Thanks! Your response is saved. You can update it anytime.";
    btn.textContent="Update response";
  }catch(e){ statusEl.textContent="Couldn’t save: "+e.message; }
  finally{ btn.disabled=false; }
});
</script>
</body>
</html>
